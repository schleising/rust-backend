services:
  backend-builder:
    image: rust:1-alpine
    profiles: ["build"]
    working_dir: /app
    volumes:
      - ./backend:/app
      - rust-backend-cargo-registry:/usr/local/cargo/registry
      - rust-backend-cargo-git:/usr/local/cargo/git
      - rust-backend-cargo-target:/app/target
      - ./backend/dist:/out
    command:
      [
        "sh",
        "-c",
        "apk add --no-cache build-base && cargo generate-lockfile && cargo update && cargo build --release && cp /app/target/release/rust-backend /out/rust-backend",
      ]

  backend:
    build:
      context: backend
    restart: unless-stopped
    environment:
      - MONGO_URL=mongodb://host.docker.internal:27017
    extra_hosts:
        - "host.docker.internal:host-gateway"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  rust-backend-cargo-registry:
    name: rust-backend-cargo-registry
  rust-backend-cargo-git:
    name: rust-backend-cargo-git
  rust-backend-cargo-target:
    name: rust-backend-cargo-target
